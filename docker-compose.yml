services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=stockai
      - POSTGRES_PASSWORD=stockai
      - POSTGRES_DB=stockai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockai"]
      interval: 5s
      retries: 5

  memory:
    build:
      context: .
      dockerfile: Dockerfile.memory
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MEMORY_LLM_PROVIDER=${MEMORY_LLM_PROVIDER:-deepseek}
      - MEMORY_DEEPSEEK_API_KEY=${MEMORY_DEEPSEEK_API_KEY}
      - MEMORY_DEEPSEEK_MODEL=${MEMORY_DEEPSEEK_MODEL:-deepseek-chat}
      - MEMORY_GEMINI_API_KEY=${MEMORY_GEMINI_API_KEY:-}
      - MEMORY_GEMINI_MODEL=${MEMORY_GEMINI_MODEL:-gemini-2.5-flash}
      - MEMORY_OPENAI_API_KEY=${MEMORY_OPENAI_API_KEY:-}
      - MEMORY_LANCE_DB_PATH=/data/lancedb
      - REDIS_ADDR=redis://redis:6379
      - MEMORY_URL=http://memory:8000
      - DOCKER_MODE=1
      - DATABASE_URL=postgresql://stockai:stockai@postgres:5432/stockai
    volumes:
      - memory_data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-test}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-test}
      - REDIS_ADDR=redis:6379
      - MEMORY_URL=http://memory:8000
      - RELAY_URL=${RELAY_URL:-http://localhost:8080}
      - HTTP_PORT=8080
    depends_on:
      redis:
        condition: service_healthy
      memory:
        condition: service_started

  engine:
    build:
      context: ./execution
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-debug}
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - BROKER_WS_URL=ws://memory:8000/ws/market
      - BROKER_REST_URL=http://memory:8000
      - MOCK_MODE=true
      - RUST_LOG=info
    depends_on:
      redis:
        condition: service_healthy
      memory:
        condition: service_started

volumes:
  memory_data:
  pg_data:
