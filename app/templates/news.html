{% block content %}
<style>
  .news-grid{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
  @media(max-width:1100px){.news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:640px){.news-grid{grid-template-columns:1fr}}

  .news-card{position:relative;padding:15px 18px;background:linear-gradient(180deg,rgba(23,24,36,0.85),rgba(18,18,26,0.85));border:1px solid var(--border-soft);border-radius:14px;transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease)}
  .news-card:hover{transform:translateY(-2px);border-color:rgba(0,255,136,0.22);box-shadow:0 0 0 1px rgba(0,255,136,0.1),0 12px 36px rgba(0,0,0,0.3)}

  .news-card .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .news-card .ticker-row{display:flex;gap:4px;flex-wrap:wrap}
  .news-card .ticker-tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:0.6rem;padding:2px 7px;border-radius:999px;font-weight:800;text-transform:uppercase}
  .news-card .ticker-tag.general{background:rgba(255,255,255,0.03);color:var(--muted);border:1px solid var(--border-soft);font-weight:600}
  .news-card .card-age{font-size:0.62rem;color:var(--muted);white-space:nowrap;font-weight:600}

  .news-card .card-title{font-size:0.88rem;font-weight:700;color:var(--fg);line-height:1.35;letter-spacing:-0.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .news-card .card-summary{font-size:0.7rem;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:auto}
  .news-card a.card-link{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;height:100%}
  .news-card .arrow{position:absolute;top:14px;right:14px;font-size:0.7rem;color:var(--muted);opacity:0;transform:translateX(-6px);transition:all .2s var(--ease)}
  .news-card:hover .arrow{opacity:1;transform:translateX(0);color:var(--accent)}
</style>

<header>
  <h1>Market News <span class="muted">via Economic Times</span></h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="status" style="font-size:0.65rem;color:var(--muted)"></span>
    <input type="text" id="search" placeholder="Search ticker or keyword..." oninput="render()" aria-label="Search news" style="width:200px">
    <button onclick="fetchNews()" aria-label="Refresh news">Refresh</button>
  </div>
</header>

<div class="news-grid" id="news-list"><div class="loading" style="grid-column:1/-1">Loading news...</div></div>
{% endblock %}
<script>
let newsItems=[];
function timeAgo(dateStr){
  if(!dateStr)return'';
  const diff=Date.now()-new Date(dateStr).getTime();
  const m=Math.floor(diff/60000),h=Math.floor(m/60),d=Math.floor(h/24),mo=Math.floor(d/30);
  if(mo>0)return mo+'mo ago';if(d>0)return d+'d ago';if(h>0)return h+'h ago';if(m>0)return m+'m ago';return'now';
}
async function fetchNews(){
  document.getElementById('status').textContent='Fetching...';
  try{const r=await fetch('/api/v1/news');const d=await r.json();newsItems=d.items||[];
    newsItems.sort((a,b)=>new Date(b.published||0)-new Date(a.published||0));
    document.getElementById('status').textContent=newsItems.length+' articles';
    render()}catch(e){document.getElementById('status').textContent='Failed'}
}
function render(){
  const q=(document.getElementById('search').value||'').toUpperCase();
  const filtered=newsItems.filter(i=>!q||i.title.toUpperCase().includes(q)||(i.tickers||[]).some(t=>t.includes(q)));
  if(!filtered.length){document.getElementById('news-list').innerHTML='<div class="loading" style="grid-column:1/-1">No articles match</div>';return}
  document.getElementById('news-list').innerHTML=filtered.map(i=>{
    const hasTicker=i.tickers&&i.tickers.length;
    const tkrs=hasTicker?i.tickers.slice(0,3).map(t=>`<span class="ticker-tag">${t}</span>`).join(''):'<span class="ticker-tag general">general</span>';
    const ago=timeAgo(i.published);
    const sum=i.summary?`<div class="card-summary">${i.summary.slice(0,150)}</div>`:'';
    const link=i.link;
    const inner=`<div class="card-top"><div class="ticker-row">${tkrs}</div><span class="card-age">${ago}</span></div>
      <div class="card-title">${i.title}</div>
      ${sum}`;
    if(link){return `<div class="news-card"><a class="card-link" href="${link}" target="_blank" rel="noopener">${inner}</a><span class="arrow">&rarr;</span></div>`}
    return `<div class="news-card"><div class="card-link">${inner}</div></div>`;
  }).join('');
}
fetchNews();setInterval(fetchNews,120000);
</script>
