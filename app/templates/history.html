{% block content %}
<style>
  .history-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:24px}
  .history-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .history-toolbar select{min-height:34px;font-size:0.72rem}
</style>

<header>
  <h1>Trade History <span class="muted">persisted in PostgreSQL</span></h1>
  <div class="history-toolbar">
    <span id="status" style="font-size:0.64rem;color:var(--muted)"></span>
    <select id="filter-limit" onchange="loadHistory()"><option value="100">100</option><option value="250">250</option><option value="500">500</option></select>
    <button class="btn-secondary" onclick="exportCSV()" style="font-size:0.72rem;min-height:32px;padding:6px 10px">Export CSV</button>
  </div>
</header>

<div class="history-stats" id="summary-row"></div>
<div id="history-table"></div>
{% endblock %}
<script>
let allTrades=[];
let historyTable=null;

async function loadHistory(){
  document.getElementById('status').textContent='Loading...';
  const limit=document.getElementById('filter-limit').value;
  try{const r=await fetch('/api/v1/history?limit='+limit);const d=await r.json();
    allTrades=d.trades||[];
    renderSummary(d.summary);
    renderTable();
    document.getElementById('status').textContent=allTrades.length+' trades';
  }catch(e){document.getElementById('status').textContent='Error'}
}

function renderSummary(s){
  if(!s)return;
  const el=document.getElementById('summary-row');
  const pnl=s.pnl||0;
  el.innerHTML=`
    <div class="stat"><span class="val">${s.total_trades||0}</span><span class="lbl">Total Trades</span></div>
    <div class="stat"><span class="val green">${s.wins||0}</span><span class="lbl">Wins</span></div>
    <div class="stat"><span class="val red">${s.losses||0}</span><span class="lbl">Losses</span></div>
    <div class="stat"><span class="val">${(s.win_rate||0).toFixed(0)}%</span><span class="lbl">Win Rate</span></div>
    <div class="stat"><span class="val ${pnl>=0?'green':'red'}">${pnl>=0?'+':''}₹${Math.abs(pnl).toFixed(0)}</span><span class="lbl">Net P&L</span></div>
    <div class="stat"><span class="val">₹${(s.volume||0).toFixed(0)}</span><span class="lbl">Volume</span></div>`;
}

function renderTable(){
  const columns=[
    {key:'time',label:'Time',width:'150px'},
    {key:'ticker',label:'Tkr'},
    {key:'dir',label:'Dir',width:'50px'},
    {key:'qty',label:'Qty',width:'50px'},
    {key:'entry_price',label:'Entry',width:'80px'},
    {key:'exit_price',label:'Exit',width:'80px'},
    {key:'pnl',label:'P&L %',width:'80px'},
    {key:'pnl_rupee',label:'P&L ₹',width:'90px'},
    {key:'status',label:'Status',width:'70px'}
  ];

  const rows=allTrades.map(t=>({
    time:(t.time||'').slice(0,19),
    ticker:t.ticker,
    dir:t.dir,
    qty:t.qty,
    entry_price:'₹'+(t.entry_price||0).toFixed(0),
    exit_price:'₹'+(t.exit_price||t.entry_price||0).toFixed(0),
    pnl:(t.pnl>0?'+':'')+(t.pnl||0).toFixed(2)+'%',
    pnl_rupee:(t.pnl>0?'+':'')+'₹'+Math.abs(t.pnl||0).toFixed(0),
    pnl_raw:t.pnl||0,
    status:t.status||'filled'
  }));

  historyTable=new PremiumTable('history-table',{
    columns,
    data:rows,
    pageSize:20,
    searchPlaceholder:'Search ticker, status...',
    emptyMessage:'No trades found',
    renderCell:function(key,val,row){
      if(key==='pnl'||key==='pnl_rupee'){
        const c=row.pnl_raw>0?'var(--accent)':'var(--err)';
        return `<span style="color:${c}">${val}</span>`;
      }
      if(key==='dir'){
        const cls=row.dir==='BUY'?'tag green':'tag red';
        return `<span class="${cls}">${val}</span>`;
      }
      return val;
    }
  });
}

function exportCSV(){
  if(!allTrades.length)return alert('No data');
  const csv='Time,Ticker,Direction,Qty,Entry,Exit,PnL%,PnL,Status\n'+allTrades.map(t=>[t.time,t.ticker,t.dir,t.qty,t.entry_price,t.exit_price||t.entry_price,t.pnl||0,t.pnl*0||0,t.status].join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='stockai_trades_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

loadHistory();
</script>
