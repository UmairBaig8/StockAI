{% block content %}
<style>
  .section b{color:var(--fg)}
  .ticker-chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
  .ticker-chip{padding:8px 14px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:11px;cursor:pointer;font-weight:700;font-size:0.78rem;color:var(--fg);transition:all .18s var(--ease);letter-spacing:-0.01em;position:relative;user-select:none}
  .ticker-chip:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 0 0 1px rgba(0,255,136,0.18)}
  .ticker-chip.loading{border-color:var(--accent);background:var(--accent-soft);pointer-events:none;animation:pulse-border 1.2s ease-in-out infinite}
  .ticker-chip.loading::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,0.3)}50%{box-shadow:0 0 0 4px rgba(0,255,136,0.08)}}
  .ticker-chips-label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
</style>

<header>
  <h1>Research <span class="muted">deep-dive per ticker</span></h1>
  <div style="display:flex;gap:8px;align-items:center">
    <input type="text" id="ticker-input" placeholder="e.g. RELIANCE" aria-label="Ticker" style="text-transform:uppercase;width:180px" onkeydown="if(event.key==='Enter')analyze()">
    <button onclick="analyze()" aria-label="Analyze ticker">Analyze</button>
  </div>
</header>

<div class="ticker-chips-label">Watchlist</div>
<div class="ticker-chips" id="ticker-chips">
  <span class="muted" style="font-size:0.72rem">Loading...</span>
</div>

<div id="results"></div>
{% endblock %}
<script>
let loadingChip=null;

async function analyze(ticker){
  ticker=ticker||document.getElementById('ticker-input').value.toUpperCase().replace('.NS','');
  if(!ticker)return;
  document.getElementById('ticker-input').value=ticker;

  if(loadingChip)loadingChip.classList.remove('loading');
  loadingChip=document.querySelector(`.ticker-chip[data-ticker="${ticker}"]`);
  if(loadingChip)loadingChip.classList.add('loading');

  document.getElementById('results').innerHTML='<div class="loading">Analyzing '+ticker+'...</div>';
  try{
    const[ind,news,opt]=await Promise.all([
      fetch('/api/v1/indicators/'+ticker).then(r=>r.json()),
      fetch('/api/v1/news?ticker='+ticker).then(r=>r.json()),
      fetch('/api/v1/options/'+ticker).then(r=>r.json()),
    ]);
    render(ticker,ind,news,opt);
  }catch(e){document.getElementById('results').innerHTML='<div class="loading">Error: '+e.message+'</div>'}
  if(loadingChip){loadingChip.classList.remove('loading');loadingChip=null}
}

async function loadWatchlist(){
  const chips=document.getElementById('ticker-chips');
  try{
    const r=await fetch('/api/v1/settings');
    const cfg=await r.json();
    const tickers=(cfg.tickers||'RELIANCE.NS,TCS.NS,INFY.NS,HDFCBANK.NS,ICICIBANK.NS').split(',').map(t=>t.trim().replace('.NS','')).filter(Boolean);
    chips.innerHTML=tickers.map(t=>`<div class="ticker-chip" data-ticker="${t}" onclick="analyze('${t}')">${t}</div>`).join('');
  }catch(e){chips.innerHTML='<span class="muted">Could not load watchlist</span>'}
}

function render(ticker,ind,news,opt){
  const pcr=opt.pcr||opt.market_pcr?.pcr;const sent=opt.sentiment||opt.market_pcr?.sentiment||'neutral';
  const reg=ind.regime||{};const mtf=ind.rsi_mtf||{};const macd=ind.macd||{};const bb=ind.bb||{};
  let newsHtml='';if(news.items?.length){newsHtml='<div class="section"><b>News:</b><br>'+news.items.slice(0,3).map(i=>'· '+i.title).join('<br>')+'</div>'}
  let optionsHtml='';if(pcr!=null){optionsHtml='<div class="section"><b>Options PCR:</b> '+pcr+' <span class="tag '+sent+'">'+sent.toUpperCase()+'</span></div>'}
  document.getElementById('results').innerHTML=`
    <div class="card"><h3>${ticker} @ ₹${ind.price||'--'}</h3>
      <div class="metric-row">
        <div class="metric"><span class="val ${ind.change_pct>=0?'green':'red'}">${(ind.change_pct||0).toFixed(2)}%</span><span class="lbl">Change</span></div>
        <div class="metric"><span class="val">${ind.rsi||'--'}</span><span class="lbl">RSI (1m)</span></div>
        <div class="metric"><span class="val">${mtf['5m']||'--'}</span><span class="lbl">RSI (5m)</span></div>
        <div class="metric"><span class="val">${mtf['15m']||'--'}</span><span class="lbl">RSI (15m)</span></div>
        <div class="metric"><span class="val">${ind.momentum_5||0}%</span><span class="lbl">Momentum</span></div>
      </div></div>
    <div class="card"><h3>Indicators</h3>
      <div class="section"><b>MACD:</b> Line ${macd.line?.toFixed(4)||'--'} | Signal ${macd.signal?.toFixed(4)||'--'} | Hist ${macd.histogram?.toFixed(4)||'--'}</div>
      <div class="section"><b>Bollinger:</b> Lower ₹${bb.lower?.toFixed(1)||'--'} | Mid ₹${bb.mid?.toFixed(1)||'--'} | Upper ₹${bb.upper?.toFixed(1)||'--'}</div>
      <div class="section"><b>Regime:</b> ${reg.regime||'--'} (ADX ${reg.adx||'--'}) | Volatility: ${reg.volatility||'--'} (ATR ${reg.atr_pct||'--'}%)</div>
      ${newsHtml}${optionsHtml}
    </div>`;
}

loadWatchlist();
</script>
