{% block content %}
<style>
  .provider-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:24px}
  .provider-card{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;transition:all .15s var(--ease)}
  .provider-card:hover{border-color:rgba(0,255,136,0.18)}
  .provider-card .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .provider-card .dot.on{background:var(--accent);box-shadow:0 0 6px rgba(0,255,136,0.4)}
  .provider-card .dot.off{background:var(--err)}
  .provider-card .info{flex:1;min-width:0}
  .provider-card .pname{font-size:0.76rem;font-weight:700;color:var(--fg)}
  .provider-card .pmodel{font-size:0.62rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .provider-card .pbadge{font-size:0.58rem;padding:2px 7px;border-radius:999px;font-weight:700;flex-shrink:0}
  .pbadge.active{background:var(--accent-soft);color:var(--accent)}
  .pbadge.ready{background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border-soft)}
  .pbadge.off{background:rgba(255,77,94,0.08);color:var(--err)}

  .trace-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .trace-stats{display:flex;gap:14px;font-size:0.64rem;color:var(--muted);flex-wrap:wrap}
  .trace-stats span{display:flex;align-items:center;gap:4px}

  .table-wrap{max-height:420px;overflow:auto;border:1px solid var(--border-soft);border-radius:12px}
  .chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}
  .mini-chart{background:linear-gradient(180deg,rgba(23,24,36,0.85),rgba(18,18,26,0.85));border:1px solid var(--border-soft);border-radius:12px;padding:12px;min-height:110px}
  .mini-chart h4{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;font-weight:700}
  .mini-chart .spark{width:100%;height:50px;overflow:hidden}
  .mini-chart .spark svg{width:100%;height:100%}
  .mini-chart .value{font-size:0.82rem;font-weight:800;color:var(--fg);margin-top:4px}
  .mini-chart .value span{font-size:0.58rem;color:var(--muted);margin-left:4px}
  table{width:100%;border-collapse:collapse;font-size:0.7rem}
  th,td{padding:5px 8px;border-bottom:1px solid var(--border-soft)}
  th{position:sticky;top:0;z-index:1;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.05em}
  tr:hover td{background:rgba(255,255,255,0.015)}
  tr.trace-detail td{padding:0;background:var(--surface-2)}
  .trace-detail-inner{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
  .trace-detail-inner pre{background:var(--bg);border:1px solid var(--border-soft);border-radius:8px;padding:10px;font-size:0.65rem;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0;line-height:1.5}
  .trace-detail-inner h5{font-size:0.6rem;color:var(--muted);text-transform:uppercase;margin-bottom:6px;letter-spacing:0.05em}
  .trace-expand{cursor:pointer;color:var(--accent);font-size:0.6rem;text-decoration:underline}
  .trace-err{color:var(--err)}
  .trace-ok{color:var(--accent)}
</style>

<header>
  <h1>LLM Observability <span class="muted">providers & traces</span></h1>
  <button onclick="load()" style="font-size:0.68rem;min-height:30px;padding:5px 10px">Refresh</button>
</header>

<div class="provider-row" id="provider-list"><span class="muted" style="font-size:0.7rem;padding:8px">Loading providers...</span></div>

<div class="chart-row">
  <div class="mini-chart"><h4>Request Volume</h4><div class="spark" id="volume-spark"><svg><polyline fill="none" stroke="var(--border)" stroke-width="1"/></svg></div><div class="value" id="volume-val">--</div></div>
  <div class="mini-chart"><h4>Avg Latency</h4><div class="spark" id="latency-spark"><svg><polyline fill="none" stroke="var(--border)" stroke-width="1"/></svg></div><div class="value" id="latency-val">--</div></div>
  <div class="mini-chart"><h4>Token Usage</h4><div class="spark" id="token-spark"><svg><polyline fill="none" stroke="var(--border)" stroke-width="1"/></svg></div><div class="value" id="token-val">--</div></div>
  <div class="mini-chart"><h4>Error Rate</h4><div class="spark" id="error-spark"><svg><polyline fill="none" stroke="var(--border)" stroke-width="1"/></svg></div><div class="value" id="error-val">--</div></div>
</div>

<div class="trace-header">
  <h2 style="margin:0;font-size:0.8rem">Call Traces</h2>
  <div class="trace-stats" id="trace-summary"></div>
</div>

<div style="margin-bottom:8px;display:flex;gap:8px;align-items:center">
  <input id="trace-filter" type="text" placeholder="Filter by agent, provider, error..." style="flex:1;min-width:200px;font-size:0.7rem;padding:4px 8px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;color:var(--fg)" oninput="filterTraces()">
  <label style="font-size:0.62rem;color:var(--muted);display:flex;align-items:center;gap:4px"><input type="checkbox" id="filter-errors" onchange="filterTraces()"> Errors only</label>
</div>

<div id="agent-stats" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"></div>

<div class="table-wrap">
  <table>
    <thead><tr><th>Time</th><th>Agent</th><th>Provider / Model</th><th>Tokens</th><th>Latency</th><th>Status</th><th></th></tr></thead>
    <tbody id="trace-body"><tr><td colspan="7" style="color:var(--muted);text-align:center">Loading traces...</td></tr></tbody>
  </table>
</div>
{% endblock %}
<script>
let _snapshots=[];
let _allTraces=[];
const MAX_SNAPS=30;

async function load(){
  try{const r=await fetch('/api/v1/llm/check');const d=await r.json();
    const provs=d.providers;const available=d.available||[];
    document.getElementById('provider-list').innerHTML=Object.entries(provs).map(([id,p])=>{
      const ok=p.configured;const isDefault=d.active===id;
      return `<div class="provider-card">
        <span class="dot ${ok?'on':'off'}" aria-label="${ok?'Connected':'Not configured'}"></span>
        <div class="info"><div class="pname">${p.label}</div><div class="pmodel">${ok?p.model:'No API key'}</div></div>
        <span class="pbadge ${isDefault?'active':ok?'ready':'off'}">${isDefault?'ACTIVE':ok?'Ready':'OFF'}</span>
      </div>`;
    }).join('');
  }catch(e){}
  loadTraces();
}
function drawSpark(elId, vals, color){
  const svg=document.getElementById(elId)?.querySelector('svg');
  if(!svg||vals.length<2)return;
  const w=svg.clientWidth||220,h=50;
  const min=Math.min(...vals),max=Math.max(...vals),r=max-min||1;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-min)/r)*h}`).join(' ');
  svg.innerHTML=`<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}"/>`;
}
async function loadTraces(){
  const el=document.getElementById('trace-body');
  try{
    const r=await fetch('/api/v1/llm/traces?limit=50');
    const d=await r.json();
    const s=d.summary;
    document.getElementById('trace-summary').innerHTML=`<span>${s.total_calls} calls</span><span style="color:var(--accent)">${s.success} OK</span><span style="color:var(--err)">${s.errors} err</span><span>~${s.prompt_tokens_est+ s.response_tokens_est} tok</span>`;
    const agents=d.by_agent||{};
    document.getElementById('agent-stats').innerHTML=Object.entries(agents).map(([a,st])=>
      `<div class="stat" style="flex:0 0 auto;min-width:80px"><span class="val" style="font-size:0.82rem">${st.calls}</span><span class="lbl">${a} <span style="font-size:0.55rem">${st.avg_latency_ms}ms</span></span></div>`
    ).join('');
    const traces=d.traces||[];
    let html='';
    traces.reverse().forEach((t,i)=>{
      const idx=traces.length-1-i;
      html+=`<tr>
        <td>${new Date(t.timestamp).toLocaleTimeString('en-IN',{hour12:false})}</td>
        <td>${t.agent}</td>
        <td style="font-size:0.64rem;color:var(--muted)">${t.provider}/${t.model}</td>
        <td>${t.prompt_tokens_est}+${t.response_tokens_est}</td>
        <td>${t.latency_ms}ms</td>
        <td class="${t.success?'trace-ok':'trace-err'}">${t.success?'OK':(t.error||'ERR').substring(0,40)}</td>
        <td><span class="trace-expand" onclick="toggleTrace(${idx})">view</span></td>
      </tr>`;
      html+=`<tr class="trace-detail" id="trace-${idx}" style="display:none"><td colspan="7"><div class="trace-detail-inner">
        <div><h5>Request (prompt)</h5><pre>${escHtml(t.prompt||'(empty)')}</pre></div>
        <div><h5>Response</h5><pre>${escHtml(t.response||'(empty)')}</pre></div>
      </div></td></tr>`;
    });
    _allTraces=traces;
    filterTraces();
    // build snapshot
    const calls=traces.length;
    const avgLat=traces.length?Math.round(traces.reduce((x,t)=>x+(t.latency_ms||0),0)/traces.length):0;
    const tokens=traces.reduce((x,t)=>x+(t.prompt_tokens_est||0)+(t.response_tokens_est||0),0);
    const errs=traces.filter(t=>!t.success).length;
    const errRate=calls?Math.round(errs/calls*100):0;
    _snapshots.push({calls,avgLat,tokens,errRate});
    if(_snapshots.length>MAX_SNAPS)_snapshots.shift();
    document.getElementById('volume-val').innerHTML= `${calls}<span>calls</span>`;
    document.getElementById('latency-val').innerHTML= `${avgLat}<span>ms avg</span>`;
    document.getElementById('token-val').innerHTML= `${tokens}<span>tok</span>`;
    document.getElementById('error-val').innerHTML= `${errRate}<span>% err</span>`;
    drawSpark('volume-spark',_snapshots.map(s=>s.calls),'var(--accent)');
    drawSpark('latency-spark',_snapshots.map(s=>s.avgLat),'var(--warn)');
    drawSpark('token-spark',_snapshots.map(s=>s.tokens),'var(--focus)');
    drawSpark('error-spark',_snapshots.map(s=>s.errRate),'var(--err)');
  }catch(e){el.innerHTML='<tr><td colspan="6" style="color:var(--err);text-align:center">Error loading traces</td></tr>'}
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toggleTrace(i){const el=document.getElementById('trace-'+i);el.style.display=el.style.display==='none'?'':'none';}
function filterTraces(){
  const q=(document.getElementById('trace-filter').value||'').toLowerCase();
  const errsOnly=document.getElementById('filter-errors').checked;
  const filtered=_allTraces.filter(t=>{
    if(errsOnly&&t.success)return false;
    if(q){
      const hay=(t.agent+' '+t.provider+' '+t.model+' '+t.error+' '+t.prompt).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  const el=document.getElementById('trace-body');
  let html='';
  filtered.forEach((t,i)=>{
    const idx=_allTraces.indexOf(t);
    html+=`<tr>
      <td>${new Date(t.timestamp).toLocaleTimeString('en-IN',{hour12:false})}</td>
      <td>${t.agent}</td>
      <td style="font-size:0.64rem;color:var(--muted)">${t.provider}/${t.model}</td>
      <td>${t.prompt_tokens_est}+${t.response_tokens_est}</td>
      <td>${t.latency_ms}ms</td>
      <td class="${t.success?'trace-ok':'trace-err'}">${t.success?'OK':(t.error||'ERR').substring(0,40)}</td>
      <td><span class="trace-expand" onclick="toggleTrace(${idx})">view</span></td>
    </tr>`;
    html+=`<tr class="trace-detail" id="trace-${idx}" style="display:none"><td colspan="7"><div class="trace-detail-inner">
      <div><h5>Request (prompt)</h5><pre>${escHtml(t.prompt||'(empty)')}</pre></div>
      <div><h5>Response</h5><pre>${escHtml(t.response||'(empty)')}</pre></div>
    </div></td></tr>`;
  });
  el.innerHTML=html||'<tr><td colspan="7" style="color:var(--muted);text-align:center">No traces match filter</td></tr>';
}
load();setInterval(loadTraces,15000);
</script>
