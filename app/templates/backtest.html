{% block content %}
<style>
  .ticker-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .ticker-chip{padding:7px 14px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;font-size:0.74rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s var(--ease);user-select:none;letter-spacing:-0.01em}
  .ticker-chip:hover{border-color:var(--accent);color:var(--fg)}
  .ticker-chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px rgba(0,255,136,0.15)}

  .params-row{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .param-group{display:flex;align-items:center;gap:6px}
  .param-group label{font-size:0.66rem;color:var(--muted);font-weight:700;margin:0;white-space:nowrap}

  .equity-chart-wrap{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;padding:14px 18px 18px;margin-bottom:14px;width:100%}
  .equity-chart-wrap svg{width:100%;height:210px}
  .chart-summary{display:flex;gap:20px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
  .chart-summary .ticker-label{font-size:0.82rem;font-weight:700;color:var(--fg);letter-spacing:-0.02em}
  .chart-summary .equity-change{font-size:1.15rem;font-weight:800;letter-spacing:-0.03em}
  .chart-summary .equity-range{display:flex;gap:14px;font-size:0.66rem;color:var(--muted)}
  .chart-summary .equity-range strong{color:var(--fg);font-weight:700}
  .chart-grid{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .chart-grid .stat{flex:1;min-width:100px}

  .perf-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px}

  .pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;font-size:0.68rem;color:var(--muted)}
  .pagination button{padding:4px 10px;min-height:auto;font-size:0.68rem}

  .loading-row{text-align:center;padding:40px;color:var(--muted)}
</style>

<header>
  <h1>Backtest <span class="muted">simulate strategy on historical data</span></h1>
</header>

<div class="ticker-row" id="ticker-chips"><span class="muted" style="font-size:0.72rem;padding:7px 0">Loading tickers...</span></div>

<div class="params-row">
  <div class="param-group">
    <label for="period">Period</label>
    <select id="period"><option value="1mo">1 mo</option><option value="3mo">3 mo</option><option value="6mo" selected>6 mo</option><option value="1y">1 year</option><option value="2y">2 years</option></select>
  </div>
  <div class="param-group">
    <label for="interval">Interval</label>
    <select id="interval"><option value="1h" selected>1 hour</option><option value="1d">1 day</option><option value="15m">15 min</option></select>
  </div>
</div>

<div id="results">
  <div class="loading-row">Select a ticker above to run backtest</div>
</div>
{% endblock %}
<script>
const PAGE_SIZE=10;
let activeTicker='';
let tickerList=[];

async function loadTickers(){
  const seen=new Map();
  try{
    const r=await fetch('/api/v1/settings');
    const cfg=await r.json();
    (cfg.tickers||'').split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>seen.set(t,1));
  }catch(e){}
  try{
    const r=await fetch('/api/v1/history?limit=200');
    const d=await r.json();
    (d.trades||[]).forEach(t=>{const tk=t.ticker;if(tk){const k=tk.includes('.NS')?tk:tk+'.NS';if(!seen.has(k))seen.set(k,1)}});
  }catch(e){}
  if(!seen.size){seen.set('RELIANCE.NS',1);seen.set('TCS.NS',1);seen.set('INFY.NS',1)}
  tickerList=[...seen.keys()].sort();
  renderChips();
  if(tickerList.length)selectTicker(tickerList[0]);
}
function renderChips(){
  document.getElementById('ticker-chips').innerHTML=tickerList.map(tk=>
    `<span class="ticker-chip${tk===activeTicker?' active':''}" onclick="selectTicker('${tk}')">${tk.replace('.NS','')}</span>`
  ).join('');
}
function selectTicker(tk){
  activeTicker=tk;
  renderChips();
  runBacktest();
}

async function runBacktest(){
  if(!activeTicker)return;
  const period=document.getElementById('period').value;
  const interval=document.getElementById('interval').value;
  document.getElementById('results').innerHTML=`<div class="loading-row">Running backtest on ${activeTicker.replace('.NS','')} (${period}, ${interval})...</div>`;
  try{
    const r=await fetch('/api/v1/backtest',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tickers:activeTicker,period,interval})});
    const d=await r.json();
    if(d.error){document.getElementById('results').innerHTML=`<div class="loading-row">${d.error}</div>`;return}
    const s=d.summary;const ret=s.total_return_pct||0;
    const color=ret>=0?'var(--accent)':'var(--err)';
    const sign=ret>=0?'+':'';
    const curves=d.equity_curves||{};
    const curve=curves[activeTicker]||[];
    const chartHtml=curve.length>1?renderChart(activeTicker,curve):'';
    const trades=d.recent_trades||[];
    window._trades=trades;window._page=0;
    document.getElementById('results').innerHTML=`
      <div class="perf-row">
        <div class="stat"><span class="val">${s.total_trades}</span><span class="lbl">Trades</span></div>
        <div class="stat"><span class="val">${s.win_rate}%</span><span class="lbl">Win Rate</span></div>
        <div class="stat"><span class="val ${ret>=0?'green':'red'}">${sign}${ret}%</span><span class="lbl">Return</span></div>
        <div class="stat"><span class="val">${(s.cagr||0).toFixed(1)}%</span><span class="lbl">CAGR</span></div>
        <div class="stat"><span class="val ${s.sharpe_ratio>=0?'green':'red'}">${s.sharpe_ratio}</span><span class="lbl">Sharpe</span></div>
        <div class="stat"><span class="val red">${s.max_drawdown_pct}%</span><span class="lbl">Max DD</span></div>
        <div class="stat"><span class="val">₹${s.avg_win.toFixed(0)}</span><span class="lbl">Avg Win</span></div>
        <div class="stat"><span class="val">₹${s.avg_loss.toFixed(0)}</span><span class="lbl">Avg Loss</span></div>
        <div class="stat"><span class="val">${s.profit_factor}</span><span class="lbl">Profit Factor</span></div>
      </div>
      ${chartHtml}
      <div class="card"><h3>Trades</h3>
        <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Dir</th><th>Q</th><th>Entry</th><th>Exit</th><th>P&L%</th><th>₹</th></tr></thead>
        <tbody id="trade-body"></tbody></table></div>
        <div class="pagination" id="trade-pager"></div>
      </div>`;
    renderTradePage();
  }catch(e){document.getElementById('results').innerHTML=`<div class="loading-row">Error: ${e.message}</div>`}
}

function renderTradePage(){
  const trades=window._trades||[];
  const page=window._page||0;
  const start=page*PAGE_SIZE;
  const slice=trades.slice(start,start+PAGE_SIZE);
  const el=document.getElementById('trade-body');
  if(!el)return;
  el.innerHTML=slice.map(t=>`<tr><td>${(t.entry_time||'').slice(0,16)}</td><td>${t.dir}</td><td>${t.qty}</td><td>${t.entry}</td><td>${t.exit}</td><td style="color:${t.pnl_pct>0?'var(--accent)':'var(--err)'}">${(t.pnl_pct>0?'+':'')+t.pnl_pct}%</td><td style="color:${t.pnl>0?'var(--accent)':'var(--err)'}">₹${t.pnl}</td></tr>`).join('');
  const total=Math.max(1,Math.ceil(trades.length/PAGE_SIZE));
  const pager=document.getElementById('trade-pager');
  if(!pager)return;
  pager.innerHTML=`<button onclick="window._page=Math.max(0,${page-1});renderTradePage()" ${page===0?'disabled':''}>Prev</button><span>${page+1} / ${total}</span><button onclick="window._page=Math.min(${total-1},${page+1});renderTradePage()" ${page>=total-1?'disabled':''}>Next</button>`;
}

function renderChart(ticker,vals){
  const len=vals.length;if(len<2)return'';
  const w=1000,h=220,ml=56,mr=20,mt=20,mb=30;
  const pw=w-ml-mr,ph=h-mt-mb;
  const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const startVal=vals[0],endVal=vals[len-1];
  const pct=((endVal-startVal)/startVal*100).toFixed(1);
  const colorHex=pct>=0?'#00ff88':'#ff4d5e';
  const colorVar=pct>=0?'var(--accent)':'var(--err)';

  const pts=vals.map((v,i)=>`${ml+(i/(len-1))*pw},${mt+ph-((v-min)/range)*ph}`).join(' ');
  const areaPts=pts+` ${ml+pw},${mt+ph} ${ml},${mt+ph}`;

  let grid='';
  for(let i=0;i<=4;i++){
    const y=mt+(i/4)*ph;
    const val=min+(range*(1-i/4));
    grid+=`<line x1="${ml}" x2="${ml+pw}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/><text x="${ml-6}" y="${y+4}" fill="var(--muted)" font-size="10" text-anchor="end">₹${(val/1000).toFixed(1)}k</text>`;
  }

  const endX=ml+pw,endY=mt+ph-((endVal-min)/range)*ph;
  const dot=`<circle cx="${endX}" cy="${endY}" r="5" fill="${colorHex}" stroke="var(--bg)" stroke-width="2"/>`;
  const label=`<text x="${endX+10}" y="${endY+5}" fill="${colorHex}" font-size="12" font-weight="700">${pct>=0?'+':''}${pct}%</text>`;

  return `<div class="equity-chart-wrap">
    <div class="chart-summary">
      <span class="ticker-label">${ticker.replace('.NS','')}</span>
      <span class="equity-change" style="color:${colorVar}">${pct>=0?'+':''}${pct}%</span>
      <span class="equity-range"><span>Equity <strong>₹${startVal.toFixed(0)}</strong></span><span>&rarr; <strong>₹${endVal.toFixed(0)}</strong></span></span>
    </div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${grid}
      <polygon points="${areaPts}" fill="${colorHex}" opacity="0.08"/>
      <polyline fill="none" stroke="${colorHex}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
      ${dot}${label}
    </svg>
  </div>`;
}

document.getElementById('period').onchange=runBacktest;
document.getElementById('interval').onchange=runBacktest;
loadTickers();
</script>
