{% block content %}
<style>
  .settings-grid{display:grid;gap:12px}
  .settings-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;padding:14px 18px}
  .settings-card h2{font-size:0.72rem;font-weight:800;color:var(--accent);margin:0 0 10px;padding:0;border:none;letter-spacing:-0.01em}
  .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
  .field-row.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .field-row.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:0.64rem;color:var(--muted);font-weight:700}
  .field input,.field select{width:100%;min-height:34px;padding:7px 9px;font-size:0.76rem}

  .agent-table{display:grid;grid-template-columns:1fr 130px 150px;gap:6px 8px;align-items:center;font-size:0.7rem}
  .agent-table .agent-name{color:var(--fg);font-weight:600;padding:3px 0}
  .agent-table .header{font-size:0.58rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em}
  .agent-table select,.agent-table input{min-height:30px;padding:5px 7px;font-size:0.7rem}

  @media(max-width:700px){.agent-table{grid-template-columns:1fr}.field-row.cols-3,.field-row.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:420px){.field-row{grid-template-columns:1fr}}
</style>

<header>
  <h1>Settings <span class="muted">strategy parameters & LLM config</span></h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="save-status" role="status"></span>
    <button onclick="saveSettings()" aria-label="Save all settings">Save</button>
    <button class="btn-secondary" onclick="loadSettings()" aria-label="Reset to saved values">Reset</button>
  </div>
</header>

<div class="settings-grid">

  <div class="settings-card">
    <h2>LLM Provider</h2>
    <div class="field-row">
      <div class="field">
        <label for="llm_provider">Provider</label>
        <select id="llm_provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="gemini">Gemini</option><option value="anthropic">Anthropic</option><option value="bedrock">AWS Bedrock</option><option value="ollama">Ollama (local)</option></select>
      </div>
      <div class="field">
        <label for="llm_model">Model</label>
        <input type="text" id="llm_model" placeholder="deepseek-chat">
      </div>
    </div>
  </div>

  <div class="settings-card">
    <h2>Per-Agent LLM</h2>
    <div class="agent-table">
      <span class="header">Agent</span><span class="header">Provider</span><span class="header">Model</span>
      <span class="agent-name">Critic</span><select id="llm_critic_provider"><option value="">Default</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="gemini">Gemini</option><option value="anthropic">Anthropic</option></select><input type="text" id="llm_critic_model" placeholder="gpt-4o-mini">
      <span class="agent-name">Researcher</span><select id="llm_researcher_provider"><option value="">Default</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="gemini">Gemini</option><option value="anthropic">Anthropic</option></select><input type="text" id="llm_researcher_model" placeholder="gemini-2.5-flash">
      <span class="agent-name">Devil's Advocate</span><select id="llm_advocate_provider"><option value="">Default</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="gemini">Gemini</option><option value="anthropic">Anthropic</option></select><input type="text" id="llm_advocate_model" placeholder="deepseek-chat">
      <span class="agent-name">Sentiment</span><select id="llm_sentiment_provider"><option value="">Default</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="gemini">Gemini</option><option value="anthropic">Anthropic</option></select><input type="text" id="llm_sentiment_model" placeholder="gemini-2.5-flash">
      <span class="agent-name">Macro Analyst</span><select id="llm_macro_provider"><option value="">Default</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="gemini">Gemini</option><option value="anthropic">Anthropic</option></select><input type="text" id="llm_macro_model" placeholder="gemini-2.5-flash">
    </div>
  </div>

  <div class="settings-card">
    <h2>Watchlist</h2>
    <div class="field">
      <label for="tickers">Tickers (comma-separated, NSE .NS suffix)</label>
      <input type="text" id="tickers" placeholder="RELIANCE.NS, TCS.NS, INFY.NS">
    </div>
  </div>

  <div class="settings-card">
    <h2>Trading Parameters</h2>
    <div class="field-row cols-3">
      <div class="field"><label for="initial_capital">Initial Capital (₹)</label><input type="number" id="initial_capital" min="1000" step="1000"></div>
      <div class="field"><label for="max_positions">Max Positions</label><input type="number" id="max_positions" min="1" max="20"></div>
      <div class="field"><label for="position_size_pct">Position Size (%)</label><input type="number" id="position_size_pct" min="1" max="100" step="0.5"></div>
      <div class="field"><label for="take_profit_pct">Take Profit (%)</label><input type="number" id="take_profit_pct" min="0.1" max="50" step="0.1"></div>
      <div class="field"><label for="stop_loss_pct">Stop Loss (%)</label><input type="number" id="stop_loss_pct" min="0.1" max="50" step="0.1"></div>
      <div class="field"><label for="signal_cooldown">Cooldown (sec)</label><input type="number" id="signal_cooldown" min="10" max="3600"></div>
    </div>
  </div>

  <div class="settings-card">
    <h2>RSI Strategy</h2>
    <div class="field-row cols-3">
      <div class="field"><label for="rsi_period">RSI Period</label><input type="number" id="rsi_period" min="2" max="50"></div>
      <div class="field"><label for="rsi_oversold">Oversold (BUY)</label><input type="number" id="rsi_oversold" min="1" max="90"></div>
      <div class="field"><label for="rsi_overbought">Overbought</label><input type="number" id="rsi_overbought" min="10" max="100"></div>
      <div class="field"><label for="min_drop_pct">Min Drop (%)</label><input type="number" id="min_drop_pct" min="0.05" max="20" step="0.05"></div>
      <div class="field"><label for="force_trade_sec">Force Trade (sec)</label><input type="number" id="force_trade_sec" min="0" max="3600" placeholder="0 = disabled"></div>
    </div>
  </div>

</div>
{% endblock %}
<script>
  function showToast(msg, ok) {
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.className = 'toast ' + (ok ? 'success' : 'error');
    t.style.display = 'block';
    setTimeout(function() { t.style.display = 'none'; }, 4000);
  }

  async function loadSettings() {
    try {
      var r = await fetch('/api/v1/settings');
      var cfg = await r.json();
      Object.keys(cfg).forEach(function(k) {
        var el = document.getElementById(k);
        if (el) el.value = cfg[k];
      });
    } catch(e) { showToast('Failed to load settings', false); }
  }

  async function saveSettings() {
    var data = {};
    document.querySelectorAll('input[id], select[id]').forEach(function(el) {
      if (el.type === 'number') { data[el.id] = parseFloat(el.value) || 0; }
      else { data[el.id] = el.value; }
    });
    try {
      var r = await fetch('/api/v1/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      var result = await r.json();
      if (result.ok) { showToast('Settings saved. Strategy will reload automatically.', true); }
      else { showToast('Save failed', false); }
    } catch(e) { showToast('Network error: ' + e.message, false); }
  }

  loadSettings();
</script>
