{% block content %}
<style>
  .grid-2{display:grid;gap:16px;grid-template-columns:1fr 1fr}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr}}

  .provider-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.ok{background:var(--accent)}
  .dot.fail{background:var(--err)}
  .name{font-weight:600}
  .muted{color:var(--muted);font-size:12px}
  .pill{font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid var(--border)}
  .pill.ok{background:rgba(0,255,136,0.12);color:var(--accent);border-color:transparent}

  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  .stat{padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:center}
  .stat .val{font-size:18px;font-weight:600}
  .stat .lbl{font-size:11px;color:var(--muted)}

  .table-wrap{max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500}
  tr:hover{background:rgba(255,255,255,0.02)}
</style>

<h1>LLM Providers <span class="muted">connection status</span></h1>

<div class="summary" id="summary-row"></div>

<div class="grid-2">
  <div id="provider-list"></div>
  <div>
    <h2>Traces <span id="trace-summary" class="muted"></span></h2>
    <div id="agent-stats" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Time</th><th>Agent</th><th>Provider</th><th>Tok</th><th>Lat</th><th>Status</th></tr>
        </thead>
        <tbody id="trace-body"><tr><td colspan="6" class="muted">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
<script>
async function load(){
  try{const r=await fetch('/api/v1/llm/check');const d=await r.json();
    const provs=d.providers;const available=d.available||[];
    document.getElementById('summary-row').innerHTML=`
      <div class="stat"><span class="val c-green">${available.length}</span><span class="lbl">Connected</span></div>
      <div class="stat"><span class="val c-muted">${Object.keys(provs).length-available.length}</span><span class="lbl">Not Configured</span></div>
      <div class="stat"><span class="val">${d.active}</span><span class="lbl">Active</span></div>`;
    document.getElementById('provider-list').innerHTML=Object.entries(provs).map(([id,p])=>{
      const ok=p.configured;const isDefault=p.default;
      return `<div class="provider-card">
        <span class="dot ${ok?'ok':'fail'}" aria-label="${ok?'Connected':'Not configured'}"></span>
        <div class="info"><div class="name">${p.label} ${isDefault?'<span class="pill ok">ACTIVE</span>':''}</div><div class="muted">${ok?'Model: '+p.model:'No API key configured - set MEMORY_'+id.toUpperCase()+'_API_KEY in .env'}</div></div>
        ${ok?`<span class="pill ok">OK</span>`:`<span class="pill">OFF</span>`}
      </div>`}).join('');
  }catch(e){}
  loadTraces();
}
async function loadTraces(){
  try{
    const r=await fetch('/api/v1/llm/traces?limit=50');
    const d=await r.json();
    const s=d.summary;
    document.getElementById('trace-summary').innerHTML=`${s.total_calls} calls · ${s.success} OK · ${s.errors} errors · ~${s.prompt_tokens_est}+${s.response_tokens_est} tokens est`;
    const agents=d.by_agent||{};
    document.getElementById('agent-stats').innerHTML=Object.entries(agents).map(([a,st])=>
      `<div class="stat" style="flex:0 0 auto;min-width:90px"><span class="val" style="font-size:0.9rem">${st.calls}</span><span class="lbl">${a} (${st.avg_latency_ms}ms)</span></div>`
    ).join('');
    const traces=d.traces||[];
    document.getElementById('trace-body').innerHTML=traces.reverse().map(t=>
      `<tr>
        <td>${new Date(t.timestamp).toLocaleTimeString('en-IN',{hour12:false})}</td>
        <td>${t.agent}</td>
        <td>${t.provider}/${t.model}</td>
        <td>${t.prompt_tokens_est}+${t.response_tokens_est}</td>
        <td>${t.latency_ms}ms</td>
        <td style="color:${t.success?'var(--accent)':'var(--err)'}">${t.success?'OK':'ERR'}</td>
      </tr>`
    ).join('');
  }catch(e){document.getElementById('trace-body').innerHTML='<tr><td colspan="7" style="color:var(--err)">Error loading traces</td></tr>'}
}
load();
setInterval(loadTraces,15000);
</script>
