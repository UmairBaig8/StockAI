<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockAI — Market News</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0b10;--surface:#12121a;--border:#1e1e2e;--muted:#666;--fg:#c0c0c0;--accent:#00ff88;--err:#ff4444;--warn:#ffaa00;--radius:8px;--focus:#3b82f6}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,monospace;background:var(--bg);color:var(--fg);line-height:1.5;min-height:100vh}
  a{color:var(--accent);text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .skip-link{position:absolute;top:-100px;left:0;background:var(--accent);color:#000;padding:8px 16px;z-index:999}.skip-link:focus{top:0}
  .layout{display:grid;grid-template-columns:180px 1fr;min-height:100vh}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar a,.sidebar span{display:flex;align-items:center;padding:8px 10px;border-radius:var(--radius);color:var(--muted);font-size:0.8rem;min-height:40px}
  .sidebar a:hover,.sidebar a.active{background:var(--bg);color:var(--fg)}
  .sidebar .brand{font-weight:700;color:var(--accent);font-size:0.95rem;margin-bottom:8px;padding:8px 10px}
  .main{padding:20px 24px;max-width:900px}
  .mobile-nav{display:none;background:var(--surface);border-bottom:1px solid var(--border);padding:6px 10px;gap:6px}
  .mobile-nav a{color:var(--muted);font-size:0.75rem;padding:6px 10px;border-radius:var(--radius);min-height:36px;display:inline-flex;align-items:center}
  .mobile-nav a.active{background:var(--bg);color:var(--fg)}
  @media(max-width:768px){.layout{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex}.main{padding:10px}}
  h1{font-size:1.2rem;margin-bottom:4px}h1 span{color:var(--muted);font-weight:400}
  .controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  input,select{background:var(--surface);border:1px solid var(--border);color:var(--fg);padding:6px 10px;border-radius:var(--radius);font-size:0.8rem}
  input:focus,select:focus{border-color:var(--focus)}
  button{background:var(--accent);color:#000;border:none;padding:6px 14px;border-radius:var(--radius);font-size:0.8rem;cursor:pointer;min-height:36px}
  .news-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
  .news-item .tickers{margin-bottom:4px}
  .news-item .tickers span{display:inline-block;background:var(--bg);color:var(--accent);font-size:0.6rem;padding:2px 6px;border-radius:3px;margin-right:4px;font-weight:600}
  .news-item .title{font-size:0.85rem;color:var(--fg);margin-bottom:2px}
  .news-item .summary{font-size:0.7rem;color:var(--muted);margin-bottom:4px;line-height:1.5}
  .news-item .meta{font-size:0.55rem;color:var(--muted);display:flex;gap:12px}
  .news-item .meta a{font-size:0.55rem}
  .tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:0.55rem}
  .tag.bullish{background:#0a3a1a;color:var(--accent)}.tag.bearish{background:#3a0a0a;color:var(--err)}.tag.neutral{background:var(--bg);color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:0.8rem}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="layout">
  <nav class="sidebar">
    <span class="brand">StockAI</span>
    <a href="/">Cockpit</a><a href="/research">Research</a><a href="/news" class="active" aria-current="page">News</a>
    <a href="/backtest">Backtest</a><a href="/history">History</a><a href="/settings">Settings</a>
  </nav>
  <div>
    <nav class="mobile-nav"><a href="/">Cockpit</a><a href="/research">Research</a><a href="/news" class="active">News</a><a href="/history">History</a><a href="/settings">Settings</a></nav>
    <main class="main" id="main-content">
      <h1>Market News <span>via Moneycontrol & ET</span></h1>
      <div class="controls">
        <input type="text" id="search" placeholder="Search ticker or keyword..." oninput="render()" aria-label="Search news">
        <button onclick="fetchNews()" aria-label="Refresh news">Refresh</button>
        <span id="status" style="font-size:0.65rem;color:var(--muted)"></span>
      </div>
      <div id="news-list"><div class="empty">Loading news...</div></div>
    </main>
  </div>
</div>
<script>
let newsItems=[];
async function fetchNews(){
  document.getElementById('status').textContent='Fetching...';
  try{const r=await fetch('/api/v1/news');const d=await r.json();newsItems=d.items||[];
    document.getElementById('status').textContent=newsItems.length+' articles';
    render()}catch(e){document.getElementById('status').textContent='Failed'}
}
function render(){
  const q=(document.getElementById('search').value||'').toUpperCase();
  const filtered=newsItems.filter(i=>!q||i.title.toUpperCase().includes(q)||(i.tickers||[]).some(t=>t.includes(q)));
  if(!filtered.length){document.getElementById('news-list').innerHTML='<div class="empty">No articles match</div>';return}
  document.getElementById('news-list').innerHTML=filtered.map(i=>{
    const tkrs=(i.tickers||[]).slice(0,4).map(t=>`<span>$${t}</span>`).join('');
    const sum=i.summary?`<div class="summary">${i.summary.slice(0,200)}</div>`:'';
    const link=i.link?`<a href="${i.link}" target="_blank" rel="noopener">Read →</a>`:'';
    return `<div class="news-item"><div class="tickers">${tkrs||'<span style="background:transparent;color:var(--muted)">general</span>'}</div><div class="title">${i.title}</div>${sum}<div class="meta"><span>${i.published||''}</span>${link}</div></div>`;
  }).join('');
}
fetchNews();setInterval(fetchNews,120000);
</script>
</body>
</html>
