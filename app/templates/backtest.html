{% block content %}
<style>
  .backtest-intro{text-align:center;padding:28px 16px;color:var(--muted)}
  .backtest-intro h3{font-size:0.9rem;color:var(--fg);margin-bottom:8px;text-transform:none}
  .backtest-intro p{font-size:0.74rem;max-width:520px;margin:0 auto 6px;line-height:1.6}

  .ticker-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .ticker-chip{padding:6px 12px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;font-size:0.72rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s var(--ease);user-select:none}
  .ticker-chip:hover{border-color:var(--accent);color:var(--fg)}
  .ticker-chip.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  .equity-chart-wrap{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;padding:18px;margin:14px 0}
  .equity-chart-wrap .chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .equity-chart-wrap .chart-title{font-size:0.78rem;font-weight:700;color:var(--fg);letter-spacing:-0.01em}
  .equity-chart-wrap .chart-stats{display:flex;gap:16px;font-size:0.64rem;color:var(--muted)}
  .equity-chart-wrap svg{width:100%;height:200px}
</style>

<header>
  <h1>Backtest <span class="muted">simulate strategy on historical data</span></h1>
  <div style="display:flex;gap:8px;align-items:flex-end">
    <select id="period"><option value="3mo">3 mo</option><option value="6mo" selected>6 mo</option><option value="1y">1 year</option><option value="2y">2 years</option></select>
    <select id="interval"><option value="1h" selected>1 hour</option><option value="1d">1 day</option><option value="15m">15 min</option></select>
    <button onclick="runBacktest()">Run</button>
  </div>
</header>

<div class="ticker-select" id="ticker-chips"><span class="muted" style="font-size:0.72rem">Loading watchlist...</span></div>

<div id="results">
  <div class="backtest-intro">
    <h3>What is Backtesting?</h3>
    <p>Simulate your strategy on <b>historical data</b> — no real money at risk. Select tickers above, pick period & interval, then Run.</p>
  </div>
</div>
{% endblock %}
<script>
let allTickers=[],selected=new Set();

async function loadWatchlist(){
  try{const r=await fetch('/api/v1/settings');const cfg=await r.json();
    allTickers=(cfg.tickers||'RELIANCE.NS,TCS.NS,INFY.NS').split(',').map(t=>t.trim()).filter(Boolean);
    allTickers.forEach(t=>selected.add(t));
    renderChips();
  }catch(e){allTickers=['RELIANCE.NS','TCS.NS','INFY.NS'];allTickers.forEach(t=>selected.add(t));renderChips()}
}
function renderChips(){
  document.getElementById('ticker-chips').innerHTML=allTickers.map(t=>{
    const s=selected.has(t);
    return `<span class="ticker-chip${s?' selected':''}" onclick="toggleTicker('${t}')">${t.replace('.NS','')}</span>`;
  }).join('');
}
function toggleTicker(t){
  selected.has(t)?selected.delete(t):selected.add(t);
  renderChips();
}
function getSelected(){return [...selected].join(', ')}

async function runBacktest(){
  const tickers=getSelected();
  if(!tickers){alert('Select at least one ticker');return}
  document.getElementById('results').innerHTML='<div class="loading">Running backtest on '+tickers.split(',').length+' tickers... (may take 30-60s)</div>';
  const body={tickers,period:document.getElementById('period').value,interval:document.getElementById('interval').value};
  try{const r=await fetch('/api/v1/backtest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();
    if(d.error){document.getElementById('results').innerHTML='<div class="loading">'+d.error+'</div>';return}
    const s=d.summary;const ret=s.total_return_pct||0;
    const color=ret>=0?'var(--accent)':'var(--err)';
    const curves=d.equity_curves||{};
    const chartsHtml=Object.entries(curves).map(([tk,v])=>renderChart(tk,v)).join('');
    document.getElementById('results').innerHTML=`
      <div class="card">
        <div class="chart-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <span class="chart-title">${Object.keys(curves).length} ticker${Object.keys(curves).length>1?'s':''} · ${body.period} · ${body.interval}</span>
          <span style="font-size:0.72rem;font-weight:800;color:${color}">${ret>=0?'+':''}${ret.toFixed(1)}%</span>
        </div>
        <div class="metric-row">
          <div class="metric"><span class="val">${s.total_trades}</span><span class="lbl">Trades</span></div>
          <div class="metric"><span class="val">${s.win_rate}%</span><span class="lbl">Win Rate</span></div>
          <div class="metric"><span class="val ${ret>=0?'green':'red'}">${ret>=0?'+':''}${ret}%</span><span class="lbl">Return</span></div>
          <div class="metric"><span class="val">${(s.cagr||0).toFixed(1)}%</span><span class="lbl">CAGR</span></div>
          <div class="metric"><span class="val ${s.sharpe_ratio>=0?'green':'red'}">${s.sharpe_ratio}</span><span class="lbl">Sharpe</span></div>
          <div class="metric"><span class="val red">${s.max_drawdown_pct}%</span><span class="lbl">Max DD</span></div>
          <div class="metric"><span class="val">₹${s.avg_win.toFixed(0)}</span><span class="lbl">Avg Win</span></div>
          <div class="metric"><span class="val">₹${s.avg_loss.toFixed(0)}</span><span class="lbl">Avg Loss</span></div>
          <div class="metric"><span class="val">${s.profit_factor}</span><span class="lbl">Profit Factor</span></div>
        </div>
      </div>
      ${chartsHtml}
      <div class="card"><h3>Recent Trades</h3>
        <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Tkr</th><th>Dir</th><th>Qty</th><th>Entry</th><th>Exit</th><th>P&L%</th><th>P&L ₹</th></tr></thead>
        <tbody>${(d.recent_trades||[]).map(t=>`<tr><td>${(t.entry_time||'').slice(0,16)}</td><td>${t.ticker}</td><td>${t.dir}</td><td>${t.qty}</td><td>${t.entry}</td><td>${t.exit}</td><td style="color:${t.pnl_pct>0?'var(--accent)':'var(--err)'}">${(t.pnl_pct>0?'+':'')+t.pnl_pct}%</td><td style="color:${t.pnl>0?'var(--accent)':'var(--err)'}">₹${t.pnl}</td></tr>`).join('')}</tbody></table></div>
      </div>`;
  }catch(e){document.getElementById('results').innerHTML='<div class="loading">Error: '+e.message+'</div>'}
}

function renderChart(ticker,vals){
  const len=vals.length;if(len<2)return'';
  const w=960,h=200,ml=52,mr=16,mt=18,mb=28;
  const pw=w-ml-mr,ph=h-mt-mb;
  const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const startVal=vals[0],endVal=vals[len-1];
  const pct=((endVal-startVal)/startVal*100).toFixed(1);
  const color=pct>=0?'#00ff88':'#ff4d5e';

  // Line points
  const pts=vals.map((v,i)=>`${ml+(i/(len-1))*pw},${mt+ph-((v-min)/range)*ph}`).join(' ');

  // Area fill
  const areaPts=pts+` ${ml+(len-1)/(len-1)*pw},${mt+ph} ${ml},${mt+ph}`;

  // Grid lines (4 horizontal)
  let grid='';
  for(let i=0;i<=4;i++){
    const y=mt+(i/4)*ph;
    const val=min+(range*(1-i/4));
    grid+=`<line x1="${ml}" x2="${ml+pw}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="${ml-6}" y="${y+4}" fill="var(--muted)" font-size="9" text-anchor="end">₹${(val/1000).toFixed(1)}k</text>`;
  }

  // Start/end markers
  const startX=ml,startY=mt+ph-((startVal-min)/range)*ph;
  const endX=ml+pw,endY=mt+ph-((endVal-min)/range)*ph;

  // End dot
  const dot=`<circle cx="${endX}" cy="${endY}" r="4" fill="${color}" stroke="var(--bg)" stroke-width="2"/>`;

  // End label
  const label=`<text x="${endX+8}" y="${endY+4}" fill="${color}" font-size="11" font-weight="700">${pct>=0?'+':''}${pct}%</text>`;

  return `<div class="equity-chart-wrap">
    <div class="chart-header">
      <span class="chart-title">${ticker.replace('.NS','')}</span>
      <span class="chart-stats"><span>Start ₹${startVal.toFixed(0)}</span><span>End ₹${endVal.toFixed(0)}</span><span style="color:${color}">${pct>=0?'+':''}${pct}%</span></span>
    </div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${grid}
      <polygon points="${areaPts}" fill="${color}" opacity="0.08"/>
      <polyline fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
      ${dot}${label}
    </svg>
  </div>`;
}

loadWatchlist();
</script>
