<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/base.css">
<title>StockAI — Research</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0b10;--surface:#12121a;--border:#1e1e2e;--muted:#666;--fg:#c0c0c0;--accent:#00ff88;--err:#ff4444;--warn:#ffaa00;--radius:8px;--focus:#3b82f6}
  body{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;min-height:100vh}
  a{color:var(--accent);text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .skip-link{position:absolute;top:-100px;left:0;background:var(--accent);color:#000;padding:8px 16px;z-index:999}.skip-link:focus{top:0}
  .layout{display:grid;grid-template-columns:180px 1fr;min-height:100vh}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar a,.sidebar span{display:flex;align-items:center;padding:7px 8px;border-radius:var(--radius);color:var(--muted);font-size:0.76rem;min-height:36px}
  .sidebar a:hover,.sidebar a.active{background:var(--bg);color:var(--fg)}
  .sidebar .brand{font-weight:700;color:var(--accent);font-size:0.95rem;margin-bottom:8px;padding:8px 10px}
  .main{padding:20px 24px;max-width:900px}
  .mobile-nav{display:none;background:var(--surface);border-bottom:1px solid var(--border);padding:6px 10px;gap:6px}
  .mobile-nav a{color:var(--muted);font-size:0.75rem;padding:6px 10px;border-radius:var(--radius);min-height:36px;display:inline-flex;align-items:center}
  .mobile-nav a.active{background:var(--bg);color:var(--fg)}
  @media(max-width:768px){.layout{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex}.main{padding:10px}}
  h1{font-size:1.2rem;margin-bottom:12px}h1 span{color:var(--muted);font-weight:400}
  input,button{font-size:0.8rem}input{background:var(--surface);border:1px solid var(--border);color:var(--fg);padding:8px 12px;border-radius:var(--radius)}input:focus{border-color:var(--focus)}
  button{background:var(--accent);color:#000;border:none;padding:8px 16px;border-radius:var(--radius);cursor:pointer;min-height:36px}
  .search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .card h3{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
  .metric-row{display:flex;gap:12px;flex-wrap:wrap}
  .metric{flex:1;min-width:100px;text-align:center;padding:8px;background:var(--bg);border-radius:var(--radius)}
  .metric .val{font-size:1.1rem;font-weight:600;display:block}
  .metric .lbl{font-size:0.55rem;color:var(--muted);text-transform:uppercase}
  .val.green{color:var(--accent)}.val.red{color:var(--err)}
  .tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:0.55rem}
  .tag.bullish{background:#0a3a1a;color:var(--accent)}.tag.bearish{background:#3a0a0a;color:var(--err)}.tag.neutral{background:var(--bg);color:var(--muted)}
  .section{font-size:0.7rem;line-height:1.7}
  .section b{color:var(--fg)}
  .loading{color:var(--muted);font-size:0.8rem;text-align:center;padding:40px}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="layout">
  <nav class="sidebar">
    <span class="brand">StockAI</span>
    <a href="/">Cockpit</a><a href="/research" class="active" aria-current="page">Research</a><a href="/news">News</a>
    <a href="/backtest">Backtest</a><a href="/history">History</a><a href="/settings">Settings</a>
    <a href="/llm">LLM</a>
  </nav>
  <div>
    <nav class="mobile-nav"><a href="/">Cockpit</a><a href="/research" class="active">Research</a><a href="/news">News</a><a href="/history">History</a><a href="/settings">Settings</a>
    <a href="/llm">LLM</a></nav>
    <main class="main" id="main-content">
      <h1>Research <span>deep-dive per ticker</span></h1>
      <div class="search-bar">
        <input type="text" id="ticker-input" placeholder="Enter ticker (e.g. RELIANCE)" aria-label="Ticker" style="text-transform:uppercase">
        <button onclick="analyze()" aria-label="Analyze ticker">Analyze</button>
        <button onclick="autoPick()" style="background:var(--surface);color:var(--fg);border:1px solid var(--border)" aria-label="Pick a ticker from watchlist">Pick from watchlist</button>
      </div>
      <div id="results"><div class="loading">Enter a ticker to see technical indicators, news sentiment, and LLM analysis</div></div>
    </main>
  </div>
</div>
<script>
async function analyze(ticker){
  ticker=ticker||document.getElementById('ticker-input').value.toUpperCase().replace('.NS','');
  if(!ticker)return alert('Enter a ticker');
  document.getElementById('results').innerHTML='<div class="loading">Analyzing '+ticker+'...</div>';
  try{
    const[ind,news,opt]=await Promise.all([
      fetch('/api/v1/indicators/'+ticker).then(r=>r.json()),
      fetch('/api/v1/news?ticker='+ticker).then(r=>r.json()),
      fetch('/api/v1/options/'+ticker).then(r=>r.json()),
    ]);
    render(ticker,ind,news,opt);
  }catch(e){document.getElementById('results').innerHTML='<div class="loading">Error: '+e.message+'</div>'}
}
async function autoPick(){
  try{const r=await fetch('/api/v1/dash');const d=await r.json();if(d.trades?.length){analyze(d.trades[0].ticker)}else{alert('No recent trades')}}catch(e){}
}
function render(ticker,ind,news,opt){
  const pcr=opt.pcr||opt.market_pcr?.pcr;const sent=opt.sentiment||opt.market_pcr?.sentiment||'neutral';
  const reg=ind.regime||{};const mtf=ind.rsi_mtf||{};const macd=ind.macd||{};const bb=ind.bb||{};
  let newsHtml='';if(news.items?.length){newsHtml='<div class="section"><b>News:</b><br>'+news.items.slice(0,3).map(i=>'· '+i.title).join('<br>')+'</div>'}
  let optionsHtml='';if(pcr!==undefined){optionsHtml='<div class="section"><b>Options PCR:</b> '+pcr+' <span class="tag '+sent+'">'+sent.toUpperCase()+'</span></div>'}
  document.getElementById('results').innerHTML=`
    <div class="card"><h3>${ticker} @ ₹${ind.price||'--'}</h3>
      <div class="metric-row">
        <div class="metric"><span class="val ${ind.change_pct>=0?'green':'red'}">${(ind.change_pct||0).toFixed(2)}%</span><span class="lbl">Change</span></div>
        <div class="metric"><span class="val">${ind.rsi||'--'}</span><span class="lbl">RSI (1m)</span></div>
        <div class="metric"><span class="val">${mtf['5m']||'--'}</span><span class="lbl">RSI (5m)</span></div>
        <div class="metric"><span class="val">${mtf['15m']||'--'}</span><span class="lbl">RSI (15m)</span></div>
        <div class="metric"><span class="val">${ind.momentum_5||0}%</span><span class="lbl">Momentum</span></div>
      </div></div>
    <div class="card"><h3>Indicators</h3>
      <div class="section"><b>MACD:</b> Line ${macd.line?.toFixed(4)||'--'} | Signal ${macd.signal?.toFixed(4)||'--'} | Hist ${macd.histogram?.toFixed(4)||'--'}</div>
      <div class="section"><b>Bollinger:</b> Lower ₹${bb.lower?.toFixed(1)||'--'} | Mid ₹${bb.mid?.toFixed(1)||'--'} | Upper ₹${bb.upper?.toFixed(1)||'--'}</div>
      <div class="section"><b>Regime:</b> ${reg.regime||'--'} (ADX ${reg.adx||'--'}) | Volatility: ${reg.volatility||'--'} (ATR ${reg.atr_pct||'--'}%)</div>
      ${newsHtml}${optionsHtml}
    </div>`;
}
</script>
</body>
</html>
